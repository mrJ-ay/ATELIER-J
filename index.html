<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe8" />
    <meta name="description" content="DearJ가 만든 웹사이트들을 걸어 둔 작은 미술관." />
    <title>ATELIER J · 웹사이트 전시</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="bar-name" href="#top">ATELIER J</a>
      <nav class="bar-nav" id="roomNav" aria-label="전시실"></nav>
    </header>

    <main id="top">
      <section class="lobby">
        <p class="eyebrow">특별 전시 · 2026</p>
        <h1>작은 사이트들의<br /><em>상설전</em></h1>
        <p class="lobby-text">밤새 만든 것들, 끝내 만든 것들, 아직 만드는 것들. 하나씩 걸어 두었습니다. 액자를 누르면 작품 안으로 들어갈 수 있어요.</p>
        <a class="scroll-hint" href="#rooms" aria-label="전시실로 내려가기"><span></span>스크롤해서 입장</a>
      </section>

      <div id="rooms"></div>
    </main>

    <footer class="foot">
      <p class="foot-title">관람 안내</p>
      <p>일부 작품은 무료 서버에서 돌아가서 처음 들어갈 때 잠에서 깨는 데 30~50초쯤 걸립니다.</p>
      <p>로그인이 필요한 작품은 통합 로그인 <a href="https://oneid-icvq.onrender.com" target="_blank" rel="noopener">ONEID</a>로 입장하며, 문의 및 정지 계정 소명은 <a href="https://oneid-helpdesk.onrender.com" target="_blank" rel="noopener">HELPDESK 고객센터</a>에서 접수합니다.</p>
      <p class="foot-small">© ATELIER J</p>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
