<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />
    <meta name="description" content="J-LABS · DearJ의 웹 프로젝트 모음" />
    <title>J-LABS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=20261108b" />
  </head>
  <body>
    <!-- Background Grid -->
    <div class="bg-mesh" aria-hidden="true"></div>

    <!-- Navigation -->
    <header class="lab-nav">
      <div class="nav-container">
        <a class="nav-brand" href="#">
          <span class="brand-text">J-LABS</span>
        </a>
        <nav class="nav-links">
          <a href="https://oneid-helpdesk.onrender.com/?service=J-LABS" target="_blank" rel="noopener">고객센터 ↗</a>
        </nav>
      </div>
    </header>

    <main class="main-container">
      <!-- Minimal Hero -->
      <section class="hero-section">
        <h1 class="hero-title">J-LABS</h1>
        <p class="hero-desc">DearJ가 만든 14개의 웹 프로젝트들을 모아둔 공간입니다.</p>
      </section>

      <!-- Category Filter & Search -->
      <section class="controls-section">
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-btn active" data-filter="all">전체 (14)</button>
          <button class="filter-btn" data-filter="game">게임</button>
          <button class="filter-btn" data-filter="finance">금융·거래</button>
          <button class="filter-btn" data-filter="media">미디어·커뮤니티</button>
          <button class="filter-btn" data-filter="tool">도구</button>
        </div>
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="검색..." autocomplete="off" />
        </div>
      </section>

      <!-- Projects Grid -->
      <section class="project-grid" id="projectGrid">
        <!-- Dynamically rendered -->
      </section>
    </main>

    <!-- Footer -->
    <footer class="lab-footer">
      <div class="footer-container">
        <p class="cold-start-note">
          ※ 무료 서버 특성상 처음 들어갈 때 로딩(30~50초)이 발생할 수 있습니다.
        </p>
        <p class="copyright">© J-LABS · DearJ</p>
      </div>
    </footer>

    <script type="module" src="main.js?v=20261108b"></script>
  </body>
</html>
